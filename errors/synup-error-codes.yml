    errors[].message: Human-readable message. On some responses the code is inlined as "SY90005:Invalid
      token".
    errors[].context: Object carrying the offending input value for codes whose message interpolates a
      $variable; empty when not relevant.
    errors[].code: The stable SYxxxxx error code.
