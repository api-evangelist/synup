components:
  schemas:
    ResponseInteraction:
      type: object
      properties:
        interactionId:
          type: string
          format: uuid
          description: Parent interaction ID for the response
        source:
          type: string
          description: URL of the interaction site
        content:
          type: string
          description: Interaction response content
        authorName:
          type:
          - string
          - 'null'
          description: Name of person who responded
        authorAvatar:
          type:
          - string
          - 'null'
          description: URL of response author's image
        authorUrl:
          type:
          - string
          - 'null'
          description: URL of response author's profile
        date:
          type: string
          format: date-time
          description: Response timestamp
        interactionStatus:
          type: string
          enum:
          - Created
          - Completed
          - Confirmed
          - Failed
          description: 'Status of the response:

            * Created - Initial creation

            * Completed - Posted to partner site

            * Confirmed - Verified on partner site

            * Failed - Response posting failed

            '
      x-apidog-orders:
      - interactionId
      - source
      - content
      - authorName
      - authorAvatar
      - authorUrl
      - date
      - interactionStatus
      x-apidog-ignore-properties: []
      x-apidog-folder: ''
    InteractionsResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            interactions:
              type: object
              properties:
                pageInfo:
                  $ref: '#/components/schemas/PageInfo'
                edges:
                  type: array
                  items:
                    $ref: '#/components/schemas/InteractionEdge'
                totalCount:
                  type: integer
                  description: Total number of interactions matching the filters
              x-apidog-orders:
              - pageInfo
              - edges
              - totalCount
              x-apidog-ignore-properties: []
          x-apidog-orders:
          - interactions
          x-apidog-ignore-properties: []
      x-apidog-orders:
      - data
      x-apidog-ignore-properties: []
      x-apidog-folder: ''
    PageInfo:
      type: object
      properties:
        hasNextPage:
          type: boolean
          description: Indicates if there are more pages available
        hasPreviousPage:
          type: boolean
          description: Indicates if there are previous pages available
        totalPages:
          type: integer
          description: Total number of pages available
        totalRecords:
          type: integer
          description: Total number of records across all pages
      x-apidog-orders:
      - hasNextPage
      - hasPreviousPage
      - totalPages
      - totalRecords
      x-apidog-folder: ''
    Interaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the interaction
        source:
          type: string
          description: Source website of the interaction
        title:
          type:
          - string
          - 'null'
          description: Title of the interaction
        content:
          type:
          - string
          - 'null'
          description: Content of the interaction
        authorName:
          type: string
          description: Name of the author
        authorAvatar:
          type:
          - string
          - 'null'
          description: URL of author's avatar
        authorUrl:
          type:
          - string
          - 'null'
          description: URL of author's profile
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: Rating value (1-5)
        date:
          type: string
          format: date-time
          description: Date and time of the interaction
        permalink:
          type:
          - string
          - 'null'
          description: Permanent URL to the interaction
        category:
          type: string
          description: Category of the interaction
        type:
          type: string
          description: Type of the interaction
        photoUrl:
          type:
          - string
          - 'null'
          description: URL of attached photo
        photoThumbnailUrl:
          type:
          - string
          - 'null'
          description: URL of photo thumbnail
        responded:
          type: boolean
          description: Whether the interaction has been responded to
        notes:
          type:
          - string
          - 'null'
          description: Additional notes
        responses:
          type: array
          items:
            type: object
            x-apidog-orders: []
            properties: {}
            x-apidog-ignore-properties: []
          description: Array of responses
        canRespond:
          type: boolean
          description: Whether responses are allowed
        totalResponses:
          type: integer
          description: Total number of responses
      x-apidog-orders:
      - id
      - source
      - title
      - content
      - authorName
      - authorAvatar
      - authorUrl
      - rating
      - date
      - permalink
      - category
      - type
      - photoUrl
      - photoThumbnailUrl
      - responded
      - notes
      - responses
      - canRespond
      - totalResponses
      x-apidog-ignore-properties: []
      x-apidog-folder: ''
    InteractionEdge:
      type: object
      properties:
        node:
          $ref: '#/components/schemas/Interaction'
        cursor:
          type: string
          description: Cursor for pagination
      x-apidog-orders:
      - node
      - cursor
      x-apidog-ignore-properties: []
      x-apidog-folder: ''
