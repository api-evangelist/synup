        content:
          application/json:
            schema:
              type: object
              required:
              - input
              properties:
                input:
                  type: object
                  required:
                  - locationId
                  - photoIds
                  - starred
                  properties:
                    locationId:
                      type: string
                      description: ID of the location containing the photos
                      examples:
                      - TG9jYXRpb246NTIxMzI0
                    photoIds:
                      type: array
                      description: 'List of Photo IDs to be starred/unstarred, which can found from query locations

                        '
                      items:
                        type: string
                      examples:
                      - - TWVkaWFGaWxlOjg4MjY5Nw==
                        - TWVkaWFGaWxlOjg4MjY5OA==
                    starred:
                      type: boolean
                      description: true to star; false to unstar
