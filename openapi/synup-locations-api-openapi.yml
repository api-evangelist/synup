  /locations/photos/star:
    post:
      summary: Star/Unstar Location Photos
      deprecated: false
      description: "<span style=\"font-size: 14px;\">\nThis API allows you to star or unstar photo(s) for a specific location. A starred photo highlights its importance and increases its visibility in certain displays.\n    \n:::caution[]\n<span style=\"font-size: 14px;\">\nA location can have a maximum of 4 starred images. Attempting to star additional photos will result in an error.\nOnly additional photo types can be starred or unstarred. The logo and cover image cannot be starred. \n</span>\n:::\n\nFor more details, refer to [Manage photos for your location](https://developer.synup.com/doc-833258.md). \n\n</span>"
      operationId: starUnstarLocationPhotos
      tags:
      - Locations
      parameters:
      - name: Authorization
        in: header
        description: API key for authentication
        required: true
        example: API T9V35W3xxxxxxxxxxx
