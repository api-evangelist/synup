                    bulkEditTaskId: null
                    clientMutationId: null
                    errors: null
                    result:
                    - errors: null
                      locationId: TG9jYXRpb246MTE4MzMzMA==
                      status: ACTIVE
                      success: true
                    success: null
          headers: {}
