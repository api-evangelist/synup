  /locations/archive:
    post:
      summary: Archive multiple locations
      deprecated: false
      description: "<span style=\"font-size: 14px;\">\n\nThis API allows you to archive One or More Business Locations. \n\n:::info[]\n- <span style=\"font-size: 14px;\">Archiving a location does not delete it from your account.</span>\n- <span style=\"font-size: 14px;\">Archived locations cannot be updated until reactivated.</span>\n- <span style=\"font-size: 14px;\">The location will be scheduled for archival until the end of the billing cycle.</span>\n- <span style=\"font-size: 14px;\">Once the invoice for the next month is generated, the location will be archived.</span>\n- <span style=\"font-size: 14px;\">Payments for archived locations stop after the current billing cycle is completed.</span>\n\n:::\n\n</span>"
      operationId: archiveLocations
      tags:
      - Locations
      parameters:
      - name: Authorization
        in: header
        description: API key for authentication
        required: true
        example: API T9V35W3xxxxxxxxxxx
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  type: object
                  required:
                  - locationIds
                  properties:
                    locationIds:
                      type: array
                      description: Array of location Node IDs to archive
                      items:
                        type: string
                  x-apidog-orders:
                  - locationIds
              x-apidog-orders:
              - input
            example:
              input:
                locationIds:
                - TG9jYXRpb246MTE4MzMzMA==
                - TG9jYXRpb246MTE3MTM4OQ==
      responses:
        '200':
          description: Locations archived successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      archiveLocations:
                        type: object
                        properties:
                          bulkEditTaskId:
                            type:
                            - string
                            - 'null'
                          clientMutationId:
                            type:
                            - string
                            - 'null'
                          errors:
                            type:
                            - array
                            - 'null'
                            items:
                              type: string
                          result:
                            type: array
                            items:
                              type: object
                              properties:
                                errors:
                                  type:
                                  - array
                                  - 'null'
                                  items:
                                    type: string
                                locationId:
                                  type: string
                                  description: Node ID of the location
                                status:
                                  type: string
                                  enum:
                                  - ARCHIVED
                                  - ARCHIVE_SCHEDULED
                                  description: Final status of the archive operation
                                success:
                                  type: boolean
                                  description: Whether the operation was successful
                              x-apidog-orders:
                              - errors
                              - locationId
                              - status
                              - success
                          success:
                            type:
                            - boolean
                            - 'null'
                        x-apidog-orders:
                        - bulkEditTaskId
                        - clientMutationId
                        - errors
                        - result
                        - success
                    x-apidog-orders:
                    - archiveLocations
                x-apidog-orders:
                - data
              example:
                data:
                  archiveLocations:
                    bulkEditTaskId: null
                    clientMutationId: null
                    errors: null
                    result:
                    - errors: null
                      locationId: TG9jYXRpb246MTE3MTM4OQ==
                      status: ARCHIVE_SCHEDULED
                      success: true
                    - errors: null
                      locationId: TG9jYXRpb246MTE4MzMzMA==
                      status: ARCHIVE_SCHEDULED
                      success: true
                    success: null
          headers: {}
          x-apidog-name: OK
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                type: object
                properties: {}
                x-apidog-orders: []
          headers: {}
          x-apidog-name: Bad Request
