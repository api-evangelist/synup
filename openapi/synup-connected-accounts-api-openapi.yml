  /connected-accounts/connect-facebook:
    post:
      summary: Connect Facebook Page to Account
      deprecated: false
      description: 'This API initiates the process of connecting a new Facebook Page account to the system. The response provides a URL for the user to complete Facebook’s OAuth authentication flow.


        **Important Notes:**

        - The response includes a URL that the user must visit to authenticate and connect their Facebook Page account.

        - The provided URL is valid for 24 hours.

        - When the user accesses the URL, they are redirected to Facebook’s OAuth authentication flow.

        - During OAuth, the user must:

        - Review and accept Facebook’s terms and conditions.

        - Grant necessary permissions for integration.

        - After OAuth authentication:

        - If successful, the user is redirected to the successUrl specified in the request.

        - If permissions are declined or the process fails, the user is redirected to the errorUrl.'
      operationId: connectFacebookAccount
      tags:
      - Connected Accounts
      parameters:
      - name: Authorization
        in: header
        description: API key for authentication
        required: true
        example: API T9V35W3xxxxxxxxxxx
        schema:
          type: string
      - name: Content-Type
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  type: object
                  required:
                  - errorUrl
                  - successUrl
                  properties:
                    errorUrl:
                      type: string
                      description: Redirect URL in case of Error
                      examples:
                      - http://www.errorurl.com
                    successUrl:
                      type: string
                      description: Redirect URL in case of Success
                      examples:
                      - http://www.successurl.com
                  x-apidog-orders:
                  - errorUrl
                  - successUrl
              x-apidog-orders:
              - input
            example:
              input:
                errorUrl: http://www.errorurl.com
                successUrl: http://www.successurl.com
      responses:
        '200':
          description: Successfully generated connection URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      bulkConnectLinkForFacebook:
                        type: object
                        properties:
                          errors:
