  /location-connections:
    get:
      summary: List location connections
      deprecated: false
      description: 'This API returns a paginated list of your locations paired with each publisher (source), along with whether that location is connected, not connected, or has a connection issue for that publisher. It is the direct API equivalent of the Location Connections page.


        Features:

        - Pagination support – retrieve results in batches for efficient processing.

        - Filtering options – filter location connections by:

        - Source / publisher (`source`)

        - Location id (`locationId`)

        - Location name / address / phone (`locationName`)

        - Connection status (`status`)

        - Sorting – order by location info, publisher account email, or publisher type.'
      tags:
      - Connected Accounts
      parameters:
      - name: source
        in: query
        description: 'Publisher (source) to filter by. Accepted values

          * `GoogleAccount`

          * `FacebookAccount`

          * `AppleAccount`

          * `YelpAccount`

          * `TripadvisorAccount`

          '
        required: false
        example: GoogleAccount
        schema:
          type: string
          enum:
          - GoogleAccount
          - FacebookAccount
          - AppleAccount
          - YelpAccount
          - TripadvisorAccount
      - name: locationId
        in: query
        description: Filter by one or more location ids. Accepts a raw numeric location id (e.g. `279169`) or a comma-separated list (e.g. `279169,279170`). Base64-encoded ids (`Location:<id>`) are also accepted.
        required: false
        example: '279169'
        schema:
          type: string
      - name: locationName
        in: query
        description: Free-text search across the location name, address, and phone number.
        required: false
        example: Aikido
        schema:
          type: string
      - name: status
        in: query
        description: 'Connection status to filter by.

          * `Connected` - location is connected to the source

          * `NotConnected` - location is not connected to the source

          * `ConnectionIssue` - location has a connection issue for the source

          '
        required: false
        example: NotConnected
        schema:
          type: string
          enum:
          - Connected
          - NotConnected
          - ConnectionIssue
      - name: sortField
        in: query
        description: 'Field to sort the results by.

          * `location_info`

          * `account_mail`

          * `account_type`

          '
        required: false
        example: location_info
        schema:
          type: string
          enum:
          - location_info
          - account_mail
          - account_type
      - name: sortOrder
        in: query
        description: 'Sort order. Only applied when `sortField` is provided.

          * `Ascending`

          * `Descending`

          '
        required: false
        example: Ascending
        schema:
          type: string
          enum:
          - Ascending
          - Descending
          default: Ascending
      - name: page
