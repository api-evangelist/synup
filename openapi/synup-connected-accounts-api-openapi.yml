  /connected-accounts/connect-listing:
    post:
      summary: Connect a location with a listing of a connected account
      deprecated: false
      description: 'This API links a location in your account with a listing from a connected Google My Business or Facebook Page account.


        **Required Fields:**

        - locationId – Base64-encoded unique identifier of the location.

        - connectedAccountListingId – The ID of the listing, retrieved from the Fetch Listings API.

        - connectedAccountId – The ID of the connected account managing the listing.


        **Behavior:**

        - Establishes a direct connection between the location and the listing.

        - Enables the system to sync and manage the listing’s data.'
      tags:
      - Connected Accounts
      parameters:
      - name: Authorization
        in: header
        description: API key for authentication
        required: true
        example: API T9V35W3xxxxxxxxxxx
        schema:
          type: string
      - name: Content-Type
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectListingRequest'
            example:
              input:
                locationId: TG9jYXRpb246NzM5MzM=
                connectedAccountId: 3db66afa-151d-4212-a8b7-949f9fe9aaf9
                connectedAccountListingId: R21iQnVsa0RhdGFMYWtlOmMyMWRiOWY5LTZmYTctNDE0My1hNDU2LTQzMjZkMmZiN2UwZg==
      responses:
        '200':
          description: Connection process completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectListingResponse'
              examples:
                '1':
                  summary: Successful connection
                  value:
                    data:
                      connectListing:
                        message: null
                        success: true
                '2':
                  summary: Failed connection - Internal System Error
                  value:
                    data:
                      connectListing:
                        message: Internal System Error
                        success: false
                '3':
                  summary: Failed Connection
                  value:
                    data:
                      confirmConnectMatches:
                        failedIds:
