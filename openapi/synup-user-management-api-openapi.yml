      - User Management
      parameters:
      - name: Authorization
        in: header
        description: API key for authentication
        required: false
        example: API T9V35W3xxxxxxxxxxx
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  type: object
                  properties:
                    roleId:
                      type: string
                    firstName:
                      type: string
                    lastName:
                      type: string
                    email:
                      type: string
                    directCustomer:
                      type: boolean
                    locale:
                      type: string
                    locationIds:
                      type: array
                      items:
                        type: string
                    socialProfileIds:
                      type: array
                      items:
                        type: string
                    name:
                      type: string
                    userId:
                      type: string
                      description: Base64 encoded user ID
                    isDefaultFolder:
                      type: boolean
                  required:
                  - roleId
                  - firstName
                  - lastName
                  - email
                  - directCustomer
                  - locale
                  - locationIds
                  - socialProfileIds
                  - name
                  - userId
                  - isDefaultFolder
                  x-apidog-orders:
                  - roleId
                  - firstName
                  - lastName
                  - email
                  - directCustomer
                  - locale
                  - locationIds
                  - socialProfileIds
                  - name
                  - userId
                  - isDefaultFolder
              required:
              - input
              x-apidog-orders:
              - input
            example:
              input:
                roleId: Q3VzdG9tUm9sZToyMDgzMQ==
                firstName: 'testing '
                lastName: user
                email: sandeep.kota+918673997@synup.com
                directCustomer: true
                locale: ENGLISH
                locationIds:
                - TG9jYXRpb246ODcxMjE=
                socialProfileIds: []
                name: sandybroskis19
                isDefaultFolder: true
      responses:
        '200':
          description: Successfully added folders to user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      addUserAndFolder:
                        type: object
                        properties:
                          success:
                            type: boolean
                          assignFolder:
                            type: boolean
                          user:
                            type: object
                            properties:
                              firstName:
                                type: string
                              lastName:
                                type: string
                              email:
                                type: string
                              directCustomer:
                                type: boolean
                              databaseId:
                                type: integer
                            required:
                            - firstName
                            - lastName
                            - email
                            - directCustomer
                            - databaseId
                            x-apidog-orders:
                            - firstName
                            - lastName
                            - email
                            - directCustomer
                            - databaseId
                          folder:
                            type: object
                            properties:
                              id:
                                type: string
                              name:
                                type: string
                              locationCount:
                                type: 'null'
                            required:
                            - id
                            - name
                            - locationCount
                            x-apidog-orders:
                            - id
                            - name
                            - locationCount
                          errors:
                            type: array
                            items:
                              type: string
                        required:
                        - success
                        - assignFolder
                        - user
                        - folder
                        - errors
                        x-apidog-orders:
                        - success
                        - assignFolder
                        - user
                        - folder
                        - errors
                      addFoldersForUser:
                        type: object
                        properties:
                          status:
                            type: array
                            items:
                              type: object
                              properties:
                                errors:
                                  type:
                                  - array
                                  - 'null'
                                  items:
                                    type: string
                                folderId:
                                  type: string
                                  format: uuid
                                success:
                                  type: boolean
                              x-apidog-orders:
                              - errors
                              - folderId
                              - success
                        x-apidog-orders:
                        - status
                    required:
                    - addUserAndFolder
                    x-apidog-orders:
                    - addUserAndFolder
                    - addFoldersForUser
                required:
                - data
                x-apidog-orders:
                - data
          headers: {}
          x-apidog-name: OK
      security: []
      x-apidog-folder: User Management
      x-apidog-status: released
      x-run-in-apidog: https://app.apidog.com/web/project/797384/apis/api-19358677-run
      operationId: postUsersAddUserAndFolder
      x-operation-id-source: derived
  /users/create:
    post:
      summary: Create User with Role
      deprecated: false
      description: 'This API creates a new user with the specified role and attributes.


        **Behavior:**

        - Assigns the user a specific role based on permissions.

        - Configures user attributes such as name, email, and access level.'
      operationId: createUser
      tags:
      - User Management
      parameters:
      - name: Authorization
        in: header
        description: API key for authentication
        required: false
        example: API T9V35W3xxxxxxxxxxx
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - input
              properties:
                input:
                  $ref: '#/components/schemas/CreateUserInput'
              x-apidog-orders:
              - input
              x-apidog-ignore-properties: []
            example:
              input:
                email: user@example.com
                roleId: Q3VzdG9tUm9sZToyMDgzMQ==
                firstName: John
                directCustomer: true
      responses:
        '200':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserResponse'
              example:
                data:
                  addUser:
                    success: true
                    errors: []
                    user:
                      id: VXNlcjoxNjUzNjA=
                      createdAt: 2025-02-03 10:25:44 UTC
                      directCustomer: true
                      email: user@example.com
                      firstName: John
                      lastName: null
                      inviteStatus: INVITE_SENT
                      customRole:
                        id: Q3VzdG9tUm9sZToyMDgzMQ==
                        name: Admin
                      accountId: QWNjb3VudDoxNjE1NA==
                      preferences:
                        locale: en-US
                        dateFormat: null
                        timezone: null
                        columnOrder: null
          headers: {}
          x-apidog-name: OK
        '400':
          description: Bad Request - Invalid input parameters
          headers: {}
          x-apidog-name: Bad Request
        '401':
          description: Unauthorized - Valid API key required
          headers: {}
          x-apidog-name: Unauthorized
        '403':
          description: Forbidden - Insufficient permissions to create users
          headers: {}
          x-apidog-name: Forbidden
      security: []
      x-apidog-folder: User Management
      x-apidog-status: released
      x-run-in-apidog: https://app.apidog.com/web/project/797384/apis/api-13932627-run
  /api/v4/users/{userId}/resources:
