openapi: 3.2.0
info:
  title: Synup User Management API
  version: '4'
  description: 'REST API v4 for the Synup local marketing platform: business locations, listing syndication to 80+ directories, review/interaction aggregation and response, review campaigns, local rank tracking and grid-rank heatmaps, local and social posts, AI post ideas, menus, connected accounts, users and profile analytics.'
  contact:
    name: Synup Developer Documentation
    url: https://developer.synup.com/
  x-assembled-by: api-evangelist enrichment pipeline (local-v1)
  x-assembled-from: 506 per-endpoint OpenAPI fragments published at https://developer.synup.com/<slug>.md
  x-assembled-date: '2026-08-13'
servers:
- url: https://api.synup.com/api/v4
  description: Base ENV (as published in every Synup doc fragment). Tenant workspace domains (https://<workspace>.synup.com/api/v4) also serve the same API.
tags:
- name: User Management
paths:
  /users/folders/add:
    post:
      summary: Add folders to user
      deprecated: false
      description: 'This API associates one or more folders with a specified user, granting them access to manage those folders.


        **Behavior:**

        - Supports assigning multiple folders to a single user.

        - Updates the user''s permissions based on assigned folders.'
      tags:
      - User Management
      parameters:
      - name: Authorization
        in: header
        description: API key for authentication
        required: false
        example: API T9V35W3xxxxxxxxxxx
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  type: object
                  required:
                  - userId
                  - folderIds
                  - defaultFolderId
                  properties:
                    userId:
                      type: string
                      description: Base64 encoded user ID
                    folderIds:
                      type: array
                      items:
                        type: string
                        format: uuid
                      description: Array of folder UUIDs to associate with the user
                    defaultFolderId:
                      type: string
                  x-apidog-orders:
                  - userId
                  - folderIds
                  - defaultFolderId
              x-apidog-orders:
              - input
            example:
              input:
                userId: VXNlcjoxMDAyOA==
                folderIds:
                - c1d92c09-8ddd-469e-af96-0eb64a48d647
                - a5af4f5d-41b6-4a8a-b24f-98741b021b7b
                defaultFolderId: c1d92c09-8ddd-469e-af96-0eb64a48d647
      responses:
        '200':
          description: Successfully added folders to user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      addFoldersForUser:
                        type: object
                        properties:
                          status:
                            type: array
                            items:
                              type: object
                              properties:
                                errors:
                                  type:
                                  - array
                                  - 'null'
                                  items:
                                    type: string
                                folderId:
                                  type: string
                                  format: uuid
                                success:
                                  type: boolean
                              x-apidog-orders:
                              - errors
                              - folderId
                              - success
                        x-apidog-orders:
                        - status
                    x-apidog-orders:
                    - addFoldersForUser
                x-apidog-orders:
                - data
          headers: {}
          x-apidog-name: OK
      security: []
      x-apidog-folder: User Management
      x-apidog-status: released
      x-run-in-apidog: https://app.apidog.com/web/project/797384/apis/api-13994432-run
      operationId: postUsersFoldersAdd
      x-operation-id-source: derived
  /users/locations/add:
    post:
      summary: Add Locations to User
      deprecated: false
      description: 'This API associates specific locations with a user, granting them access to manage those locations.


        **Behavior:**

        - Supports assigning multiple locations to a single user.

        - Updates the user''s permissions and access scope based on assigned locations.'
      operationId: addLocationsToUser
      tags:
      - User Management
      parameters:
      - name: Authorization
        in: header
        description: API key for authentication
        required: false
        example: API T9V35W3xxxxxxxxxxx
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - input
              properties:
                input:
                  $ref: '#/components/schemas/AddLocationsInput'
              x-apidog-orders:
              - input
              x-apidog-ignore-properties: []
            example:
              input:
                userId: VXNlcjoxMjMyMDE=
                locationIds:
                - TG9jYXRpb246MTE3NjE5NQ==
                - TG9jYXRpb246MTE0NzgxNA==
      responses:
        '200':
          description: Locations successfully added to user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddLocationsResponse'
              example:
                data:
                  addLocationsForUser:
                    status:
                    - errors: null
                      locationId: TG9jYXRpb246MTE3NjE5NQ==
                      success: true
                    - errors: null
                      locationId: TG9jYXRpb246MTE0NzgxNA==
                      success: true
          headers: {}
          x-apidog-name: OK
        '400':
          description: Bad Request - Invalid input parameters
          headers: {}
          x-apidog-name: Bad Request
        '401':
          description: Unauthorized - Valid API key required
          headers: {}
          x-apidog-name: Unauthorized
        '403':
          description: Forbidden - Insufficient permissions
          headers: {}
          x-apidog-name: Forbidden
        '404':
          description: Not Found - User or locations not found
          headers: {}
          x-apidog-name: Record Not Found
      security: []
      x-apidog-folder: User Management
      x-apidog-status: released
      x-run-in-apidog: https://app.apidog.com/web/project/797384/apis/api-13932855-run
  /users/add_user_and_folder:
    post:
      summary: Add User and folder
      deprecated: false
      description: This api is a combination of add_user and create_folder and assign_folder_to_user APIs. The API will take in all parameters of add_user API and create_folder APIs. Operations to be done are create user, create folder and assign folder to user.
