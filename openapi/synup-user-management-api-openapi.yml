        description: Base64 encoded user ID
        required: true
        example: VXNlcjoxNTUzNjE=
        schema:
          type: string
      - name: Authorization
        in: header
        description: API key for authentication
        required: false
        example: API T9V35W3xxxxxxxxxxx
        schema:
          type: string
