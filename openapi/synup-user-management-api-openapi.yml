  /users/folders/remove:
    post:
      summary: Remove Folders for User
      deprecated: false
      description: 'This API removes specific locations associated with a user, revoking their access to those locations.


        Behavior:

        - Supports removing one or multiple locations from a user.

        - Updates the user’s permissions and access scope accordingly.'
      tags:
      - User Management
      parameters:
      - name: Authorization
        in: header
        description: API key for authentication
        required: false
        example: API T9V35W3xxxxxxxxxxx
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - input
              properties:
                input:
                  type: object
                  required:
                  - userId
                  - folderIds
                  properties:
                    userId:
                      type: string
                      description: Base64 encoded user ID
                    folderIds:
                      type: array
                      items:
                        type: string
                        format: uuid
                      description: Array of folder UUIDs to remove for the user
                  x-apidog-orders:
                  - userId
                  - folderIds
              x-apidog-orders:
              - input
            example:
              input:
                userId: VXNlcjoxMDAyOA==
                folderIds:
                - c1d92c09-8ddd-469e-af96-0eb64a48d647
                - a5af4f5d-41b6-4a8a-b24f-98741b021b7b
      responses:
        '200':
          description: Successfully removed folders for user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      removeFoldersForUser:
                        type: object
                        properties:
                          status:
                            type: array
                            items:
                              type: object
                              properties:
                                errors:
                                  type:
                                  - array
                                  - 'null'
                                  items:
                                    type: string
                                  description: Array of error messages if any
                                folderId:
                                  type: string
                                  format: uuid
                                  description: UUID of the folder being removed
                                success:
                                  type: boolean
                                  description: Whether the folder was successfully removed
                              x-apidog-orders:
                              - errors
                              - folderId
                              - success
                        x-apidog-orders:
                        - status
                    x-apidog-orders:
                    - removeFoldersForUser
                x-apidog-orders:
                - data
              examples:
                '1':
                  summary: default
                  value:
                    data:
                      removeFoldersForUser:
                        status:
                        - errors: null
                          folderId: c1d92c09-8ddd-469e-af96-0eb64a48d647
                          success: true
                        - errors: null
                          folderId: a5af4f5d-41b6-4a8a-b24f-98741b021b7b
                          success: true
                '2':
                  summary: alternative
                  value:
                    data:
                      removeFoldersForUser:
                        status:
                        - errors: null
                          folderId: 07011529-c5bf-4808-b4f2-32d026e9bd56
