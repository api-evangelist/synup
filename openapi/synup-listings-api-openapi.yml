  /locations/listings/duplicates:
    get:
      summary: Get all duplicate listings for an account
      deprecated: false
      description: This API retrieves a paginated list of all duplicate listings detected within the account, with optional filtering
      operationId: getAccountDuplicateListings
      tags:
      - Listings
      parameters:
      - name: tag
        in: query
        description: Filter duplicates by location tag
        required: false
        example: test
        schema:
          type: string
      - name: page
        in: query
        description: Page number for pagination
        required: false
        example: 1
        schema:
          type: integer
          minimum: 1
      - name: Authorization
        in: header
        description: API key for authentication
        required: true
        example: API T9V35W3xxxxxxxxxxx
        schema:
          type: string
      - name: Content-Type
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      responses:
        '200':
          description: Duplicate listings retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      duplicateListingsRollup:
                        type: object
                        properties:
                          pageInfo:
                            type: object
                            properties:
                              hasNextPage:
                                type: boolean
                                description: Indicates if there are more pages after the current one
                              hasPreviousPage:
                                type: boolean
                                description: Indicates if there are previous pages
                              totalPages:
                                type: integer
                                description: Total number of pages available
                              totalRecords:
                                type: integer
                                description: Total number of duplicate listings
                            x-apidog-orders:
                            - hasNextPage
                            - hasPreviousPage
                            - totalPages
                            - totalRecords
                          records:
                            type: array
                            items:
                              type: object
                              properties:
                                addressValid:
                                  type: boolean
                                  description: Indicates if the address matches the primary listing
                                categoryValid:
                                  type:
                                  - boolean
                                  - 'null'
                                  description: Indicates if the business category matches
                                city:
                                  type: string
                                  description: City name
                                countryCode:
                                  type:
                                  - string
                                  - 'null'
                                  description: ISO country code
                                duplicateProcessingState:
                                  type: string
                                  enum:
                                  - POTENTIAL
                                  description: Current state of duplicate processing
                                id:
                                  type: string
                                  description: Unique identifier for the duplicate listing
                                liveLink:
                                  type: string
                                  description: URL of the duplicate listing
                                locationId:
                                  type: string
                                  description: ID of the associated location
                                name:
                                  type: string
                                  description: Business name
                                nameValid:
                                  type: boolean
                                  description: Indicates if the business name matches
                                originalLiveLink:
                                  type: string
                                  description: URL of the primary listing
                                phone:
                                  type:
                                  - string
                                  - 'null'
                                  description: Phone number
                                phoneValid:
                                  type: boolean
                                  description: Indicates if the phone number matches
                                postalCode:
                                  type: string
                                  description: Postal/ZIP code
                                siteName:
                                  type: string
                                  description: Name of the directory site
                                siteUrl:
                                  type: string
                                  description: Base URL of the directory site
                                state:
                                  type:
                                  - string
                                  - 'null'
                                  description: State/province code
                                street:
                                  type: string
                                  description: Street address
                              x-apidog-orders:
                              - addressValid
                              - categoryValid
                              - city
                              - countryCode
                              - duplicateProcessingState
                              - id
                              - liveLink
                              - locationId
                              - name
                              - nameValid
                              - originalLiveLink
                              - phone
                              - phoneValid
                              - postalCode
