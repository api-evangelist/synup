                              - liveLink
                              - aiScore
                              - aiResponse
                              - customerPrompt
                              x-apidog-orders:
                              - siteUrl
                              - liveLink
                              - aiScore
                              - aiResponse
                              - customerPrompt
                        required:
                        - aiBusinessAdvice
                        - aiVisibilityScore
                        - aiSitesResults
                        x-apidog-orders:
                        - aiBusinessAdvice
                        - aiVisibilityScore
                        - aiSitesResults
                    required:
                    - fetchAiListings
                    x-apidog-orders:
                    - fetchAiListings
                required:
                - data
                x-apidog-orders:
                - data
