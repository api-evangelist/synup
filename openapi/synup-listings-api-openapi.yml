                            - footer
                            - header
                            - tips
                            - __typename
                          aiVisibilityScore:
                            type: integer
                          aiSitesResults:
                            type: array
                            items:
                              type: object
                              properties:
                                siteUrl:
                                  type: string
                                liveLink:
                                  type:
                                  - string
                                  - 'null'
                                aiScore:
                                  type: object
                                  properties:
                                    addressSimilarity:
                                      type: number
                                    phoneSimilarity:
                                      type: integer
                                    overallSimilarity:
                                      type: number
                                    websiteSimilarity:
                                      type: integer
                                  required:
                                  - addressSimilarity
                                  - phoneSimilarity
                                  - overallSimilarity
                                  - websiteSimilarity
                                  x-apidog-orders:
                                  - addressSimilarity
                                  - phoneSimilarity
                                  - overallSimilarity
                                  - websiteSimilarity
                                aiResponse:
                                  type: object
                                  properties:
                                    name:
                                      type: string
                                    address:
                                      type: string
                                    website:
                                      type: string
                                    phone:
