  /locations/{locationId}/voice-assistants:
    get:
      summary: Get voice listings for a location
      deprecated: false
      description: 'This API retrieves all voice assistant listings associated with a specific location.


        **Available Voice Assistants:**

        - Google Assistant

        - Cortana

        - Alexa

        - Siri

        - Bixby


        **Response Includes:**

        - Sync status – Indicates whether the listing is successfully synced.

        - Connection details – Provides integration status with each voice assistant.

        - Potential issues – Highlights any errors preventing successful sync.'
      operationId: getVoiceListings
      tags:
      - Listings
      parameters:
      - name: locationId
        in: path
        description: The unique identifier of the location
        required: true
        example: TG9jYXRpb246MTA2MDY4Mw==
        schema:
