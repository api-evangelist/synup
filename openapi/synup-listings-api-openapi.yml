  /locations/{locationId}/listings/premium:
    get:
      summary: Get premium listings
      deprecated: false
      description: 'This API retrieves all premium listings associated with a specific location.


        **Response Includes:**

        - Sync status – Indicates whether the listing is synced successfully.

        - Display status – Shows whether the listing is live on the platform.

        - Platform details – Includes directories such as Google Maps, Apple Maps, and other listing sites.'
      operationId: getPremiumListings
      tags:
      - Listings
      parameters:
      - name: locationId
        in: path
        description: Node ID of the location
        required: true
        example: TG9jYXRpb246MTI0MjE=
        schema:
          type: string
      - name: Authorization
        in: header
        description: API key for authentication
        required: true
        example: API T9V35W3xxxxxxxxxxx
        schema:
          type: string
      - name: Content-Type
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      responses:
        '200':
          description: Premium listings retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      listingsForLocation:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: Node ID of the listing
                            databaseId:
                              type: string
                              description: Database ID of the listing
                            site:
                              type: object
                              properties:
                                id:
                                  type: string
                                  description: Node ID of the directory site
                                databaseId:
                                  type: string
                                  description: Database ID of the directory site
                                name:
                                  type: string
                                  description: Name of the directory site
                                url:
                                  type: string
                                  description: URL of the directory site
                                syScore:
                                  type: string
                                  description: Synup score for the directory
                              x-apidog-orders:
                              - id
                              - databaseId
                              - name
                              - url
                              - syScore
                            syncStatus:
                              type: string
                              description: Current sync status of the listing
                              enum:
