name: Synup client libraries and packages
generated: '2026-08-13'
method: searched
source: registry.npmjs.org, pypi.org, rubygems.org, github.com/synup
description: 'Synup does not link SDKs from developer.synup.com. Two first-party packages were found by
  registry search: a Node.js SDK published under the npm account whose maintainer email is dev@synup.com,
  and a React component library under the @synup npm scope. Two PyPI packages carry the same SDK shape
  and README voice but PyPI does not expose an uploader, so their first-party status is recorded as unverified
  rather than asserted.'
official_count: 2
