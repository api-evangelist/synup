currency_finding: The one unambiguous first-party API client, synup-js, sits at 0.2.0 and was last published
  2026-04-08 — four months before this probe, and after the v4 API's own published "last updated" date
  of 2025-07-21. It is current relative to the REST surface. @synup/locator-components has not been released
  since 2023 and should be read as dormant.
gaps:
- No SDK is linked from developer.synup.com, so a developer reading the docs would not find synup-js at
  all.
- No first-party Ruby, PHP, Java, Go, .NET or C# client exists.
- The two PyPI packages publish no author/maintainer metadata, which is why they cannot be credited as
  official.
