apis:
- aid: synup:synup-mcp
  name: Synup MCP Server
  description: First-party remote Model Context Protocol server enumerating 126 tools in its published
    tool table across six surfaces (Locations, Listings, Reviews, Rankings, Posts & Social, Account &
    Insights). Tenant-routed — the canonical endpoint is your own Synup workspace domain with /mcp appended.
    Authenticates with OAuth 2.1 (PKCE, dynamic client registration) or the same Synup API key via X-api-key.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.synup.com/synup-mcp-getting-connected-doc-2070739
