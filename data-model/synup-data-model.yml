- Account
- Folder (nestable; every account has a root folder that cannot be deleted)
- Location (also groupable by Tag, max 10 tags per location)
- Listing (one per directory site, 80+ sites)
- Interaction (review or Q&A) / Ranking / Post / Menu / ConnectedAccount
