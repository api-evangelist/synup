name: Synup MCP Server
generated: '2026-08-13'
method: probed
source: https://synup.github.io/synup-mcp-agent/
description: 'Synup ships a first-party remote MCP server that exposes the same surface area as the Synup
  dashboard as agent tools: locations, listings, reviews, rankings, local and social posts, flows, account
  and insights. The server is TENANT-AWARE — the canonical endpoint is your own Synup workspace domain
  with /mcp appended (https://<workspace>.synup.com/mcp), and https://mcp-agent.synup.com/mcp is the default/shared
  host that Synup publishes in its own quick-start snippet.'
status: live
deployment:
  mode: remote
  endpoint: https://mcp-agent.synup.com/mcp
  endpoint_template: https://<your-synup-workspace-domain>/mcp
  transport: streamable-http
  auth: oauth
  verified: probed
  install: "claude mcp add --transport http synup-mcp https://mcp-agent.synup.com/mcp \\\n  --header \"\
    X-api-key: YOUR_API_KEY\" \\\n  --header \"X-access-mode: write\""
  package: null
  note: Remote only. There is no npm/PyPI package and nothing to run locally — the "install" line is a
    client registration command that points an MCP client at Synup's hosted URL. Synup calls it the "Managed
    Endpoint".
x-evidence:
  probed: '2026-08-13'
  tools_list:
    url: https://mcp-agent.synup.com/mcp
    method: POST
    jsonrpc_method: tools/list
    http_status: 401
    body: '{"error":"unauthorized","error_description":"Authentication required. Use OAuth or X-Api-Key
      header."}'
    www_authenticate: Bearer resource_metadata="https://mcp-agent.synup.com/mcp/.well-known/oauth-protected-resource",
      scope="mcp:read mcp:write"
    note: The live tool manifest is auth-gated. Tool names and input schemas below are NOT harvested from
      tools/list; the surface groups and counts are what Synup itself publishes.
  oauth_authorization_server:
    url: https://mcp-agent.synup.com/.well-known/oauth-authorization-server
    http_status: 200
  oauth_protected_resource:
    url: https://mcp-agent.synup.com/mcp/.well-known/oauth-protected-resource
    http_status: 200
  jwks:
    url: https://mcp-agent.synup.com/.well-known/jwks.json
    http_status: 200
  tool_table:
    url: https://synup.github.io/synup-mcp-agent/
    http_status: 200
    probed: '2026-08-13'
    finding: First-party MCP documentation site published from the synup GitHub organization; carries
      the full tool table (name, friendly name, description) inline in the page.
authentication:
  methods:
  - type: oauth
    detail: OAuth 2.1 with dynamic client registration and PKCE (S256). Discovery at https://mcp-agent.synup.com/.well-known/oauth-authorization-server.
      Used by Claude.ai and Claude Desktop custom connectors.
    scopes:
    - mcp:read
    - mcp:write
  - type: api-key
    detail: 'Header X-api-key: <Synup API key>, optionally with X-user-email. Used by Claude Code, Cursor
      and Windsurf configs.'
  - type: bearer
    detail: 'Authorization: Bearer <API key | encoded credential | Synup token>.'
  - type: environment
    detail: SYNUP_API_KEY and SYNUP_USER_EMAIL for local/embedded setups with no headers.
  access_mode:
    header: X-access-mode
    values:
    - read
    - write
    note: Read-only by default in the docs guidance; write must be explicitly requested. Under OAuth the
      access level is what the user approved at sign-in.
tool_discovery:
  default: lazy
  note: The server does NOT list all tools on connect. It advertises a light footprint and pulls in the
    tool it needs on demand, "rather than load all 120+ tools at once".
  direct_mode_header:
    X-MCP-Mode: direct
    effect: Return the full tool list up front, for agents that call tools by name.
  filter_headers:
  - header: X-tags-include
    example: domain:reviews,domain:locations
    effect: Expose only the named domains.
  - header: X-tags-exclude
    example: domain:local_posts
    effect: Hide the named domains.
  domain_tags:
  - locations
  - listings
  - reviews
  - local_posts
  - social_posts
  - rankings
  - flows
  - account
  - insights
