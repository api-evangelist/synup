- https://developer.synup.com/synup-mcp-putting-it-to-work-doc-2223537
- https://help.synup.com/ (Synup MCP knowledge base, 7 articles)
version_published: v1.0.0
tool_count_discrepancy: 'Synup publishes three different counts: the MCP docs table renders 126 rows,
  its own heading says 127, and www.synup.dev advertises 131 tools across 6 surfaces. 126 is the number
  actually enumerated.'
