install_snippet_published_by_provider: "claude mcp add --transport http synup-mcp https://YOUR_SYNUP_DOMAIN/mcp\
  \ \\\n  --header \"X-api-key: YOUR_API_KEY\" \\\n  --header \"X-access-mode: write\""
clients_documented:
- Claude.ai
- Claude Desktop
- Claude Code
- Cursor
- Windsurf
notes:
- 'mode is remote: an MCP client POSTs directly to an https URL. Synup ships no stdio/npx package.'
- The endpoint is tenant-routed — using your own workspace domain sends the OAuth flow to the right sign-in
  page and the right account. mcp-agent.synup.com is the managed default.
- Tool input schemas still require an authenticated tools/list; the names and descriptions below are the
  provider-published table, not a live introspection.
- 'DOC DEFECT: the Cursor and Windsurf snippets on synup.github.io/synup-mcp-agent set "type": "stdio"
  alongside a "url" field. The developer.synup.com guide sets "type": "http" for the same config. The
  server is HTTP; the GitHub Pages snippet is wrong.'
- list_available_operations is shipped as a tool because the server lazy-loads its tool set instead of
  listing everything on connect.
docs:
- https://synup.github.io/synup-mcp-agent/
