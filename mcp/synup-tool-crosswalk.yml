name: Synup MCP <-> REST tool crosswalk
generated: '2026-08-13'
method: derived
source: https://synup.github.io/synup-mcp-agent/ (published tool table) + openapi/synup-api-openapi.yml
description: Binding between the 126 MCP tools Synup publishes in its own MCP documentation site and the
  210 REST operations in its OpenAPI. The live tools/list is auth-gated (HTTP 401 + OAuth challenge),
  so no inputSchema was read; every binding below is by tool name and the provider's own tool description
  against a published REST operation, with confidence recorded honestly.
surfaces:
  openapi:
    file: openapi/synup-api-openapi.yml
    operations: 204
    gated: false
  mcp:
    url: https://mcp-agent.synup.com/mcp
    tools_published: 126
    gated: true
    gate: HTTP 401 on tools/list; WWW-Authenticate Bearer resource_metadata=..., scope="mcp:read mcp:write"
    tool_table: https://synup.github.io/synup-mcp-agent/
  graphql:
    url: null
    note: No public GraphQL endpoint, though the REST API is a facade over a GraphQL core.
  webhooks:
    file: openapi/synup-webhooks-openapi.yml
    events: 43
    gated: false
