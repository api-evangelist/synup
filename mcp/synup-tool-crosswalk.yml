coverage:
  mcp_tools: 126
  tools_bound: 54
  tools_mcp_only: 72
  rest_operations: 204
  rest_operations_bound: 63
  rest_only: 148
notes:
- 'The two surfaces are genuinely different products, not projections of each other: 72 of 126 MCP tools
  have no public REST equivalent (social profiles and brand posting, automation flows, billing and invoices,
  churn risk, FAQs and service items, Instagram/Twitter top posts, national-day post inspiration), and
  148 REST operations have no MCP tool (the AI post-idea pipeline dominates that side).'
- 'Tool counts disagree across Synup''s own surfaces: the MCP docs table renders 126 rows under a heading
  that says 127, and www.synup.dev advertises 131 tools across 6 surfaces.'
- 'list_available_operations is a meta-tool: Synup ships tool discovery as a tool, because the server
  lazily loads tools rather than listing them on connect.'
