    finding: status.synup.com is a wildcard onto the Synup application sign-in page ("Synup | Sign In
      ... Welcome to Synup Social!"), not a status page. It answers 200 with a login form and publishes
      no component or incident state.
    probed: '2026-08-13'
  note: A prior apis.yml carried a StatusPage pointer at https://status.synup.com/. Synup itself links
    "Synup Status" from the help-center footer to that host, but the host serves the Synup application
    sign-in page, not a status page. The pointer was removed rather than credited — a 200 on a login form
    is not a published status page.
  linked_from: https://help.synup.com/ footer links "Synup Status" to https://status.synup.com
sla:
